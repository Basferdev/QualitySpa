{% extends 'Principal/base.html' %}

{% block content1 %}
    <section class="bg-light">
        <div class="container pb-5">
            <div class="row">
                <div class="col-lg-5 mt-5">
                    <div class="card mb-3">
                        <img class="card-img img-fluid" src="{{ producto.image.url }}" alt="{{ producto.title }}">
                    </div>
                </div>
                <div class="col-lg-7 mt-5">
                    <div class="card">
                        <div class="card-body">
                            <h1 class="h2">{{ producto.title }}</h1>
                            <p class="h3 py-2">{{ producto.price }}$</p>
                         
                            <h6>Description:</h6>
                            <p>{{ producto.description }}</p>
                            <ul class="list-unstyled">
                                <li><strong>Stock:</strong> {{ producto.stock }}</li>
                                <li><strong>Created:</strong> {{ producto.created }}</li>
                            </ul>
                            <form action="" method="GET">
                                <button type="submit" class="btn btn-success btn-lg" name="submit" value="buy">Buy</button>
                                <button type="submit" class="btn btn-success btn-lg" name="submit" value="addtocart">Add to Cart</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
{% endblock %}
